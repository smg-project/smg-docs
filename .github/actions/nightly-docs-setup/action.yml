name: Set up nightly documentation tools
description: Prepare Python, gh, and the runner-provided Anthropic key
inputs:
  docs-sha:
    description: Immutable docs default-branch commit to document
    required: true
  source-ref:
    description: Immutable SMG commit (empty resolves main)
    default: ''
outputs:
  source-sha:
    description: Pinned SMG source revision
    value: ${{ steps.source.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Use runner Python when compatible
      id: python
      shell: bash
      run: |
        if command -v python3 >/dev/null && python3 -c 'import sys; assert (3, 12) <= sys.version_info < (4, 0)'; then
          echo 'available=true' >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-python@v6
      if: steps.python.outputs.available != 'true'
      with:
        python-version: '3.12'
    - name: Export API key from pod environment
      shell: bash
      run: |
        : "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY in the smg-org-runner-cpu pod environment}"
        echo "::add-mask::${ANTHROPIC_API_KEY}"
        echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}" >> "$GITHUB_ENV"
    - name: Install gh CLI if needed
      shell: bash
      run: bash scripts/doc-sync/install-gh.sh
    - name: Preserve workflow tools and check out documentation source
      # Fixture commits otherwise start a detached `git maintenance run --auto`
      # (Git 2.47+), whose lock file can race temp-repo cleanup: run 42793291666
      # lost release review batch 31 to "Directory not empty: '.git'".
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.docs-sha }}
        GIT_CONFIG_COUNT: '1'
        GIT_CONFIG_KEY_0: maintenance.auto
        GIT_CONFIG_VALUE_0: 'false'
      run: |
        python3 -m unittest discover -s scripts/doc-sync -p 'test_*.py' -q
        python3 scripts/doc-sync/prepare_source.py "$SOURCE_SHA" "$RUNNER_TEMP/nightly-docs-tools"
    - name: Resolve the current SMG main revision
      if: inputs.source-ref == ''
      id: release
      shell: bash
      run: python3 "$RUNNER_TEMP/nightly-docs-tools/releases.py" --main
    - uses: actions/checkout@v7
      with:
        repository: smg-project/smg
        ref: ${{ inputs.source-ref || steps.release.outputs.sha }}
        fetch-depth: 0
        persist-credentials: false
        path: .nightly-source
    - name: Pin the separate source checkout
      id: source
      shell: bash
      run: |
        export SOURCE_ROOT="$GITHUB_WORKSPACE/.nightly-source"
        echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
        echo "sha=$(git -C "$SOURCE_ROOT" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
