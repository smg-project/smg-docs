name: Maintain One Documentation PR

on:
  workflow_call:
    inputs:
      number:
        type: number
        required: true
      apply:
        type: boolean
        default: false
      force:
        type: boolean
        default: false
      feedback:
        type: string
        default: ''

concurrency:
  group: docs-pr-maintenance-${{ inputs.number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ inputs.number }}
  APPLY: ${{ inputs.apply }}
  FORCE: ${{ inputs.force }}
  EXTRA_FEEDBACK: ${{ inputs.feedback }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    runs-on: smg-org-runner-cpu
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      work: ${{ steps.prepare.outputs.work }}
      cached: ${{ steps.prepare.outputs.cached }}
      base: ${{ steps.prepare.outputs.base }}
      code: ${{ steps.prepare.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve setup action across the documentation checkout
        run: |
          mkdir -p .maintenance-action
          cp .github/actions/docs-maintenance-setup/action.yml .maintenance-action/action.yml
          printf '/.maintenance-action/\n' >> .git/info/exclude
      - uses: ./.maintenance-action
        with:
          export-api-key: 'false'
      - name: Pin PR, main, feedback and retry budget
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" prepare
      - uses: actions/upload-artifact@v7
        with:
          name: docs-maintenance-context-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance/context.json
          retention-days: 14
          if-no-files-found: error

  repair:
    needs: prepare
    if: needs.prepare.outputs.work == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve setup action across the documentation checkout
        run: |
          mkdir -p .maintenance-action
          cp .github/actions/docs-maintenance-setup/action.yml .maintenance-action/action.yml
          printf '/.maintenance-action/\n' >> .git/info/exclude
      - uses: ./.maintenance-action
        with:
          export-api-key: 'true'
          source-ref: ${{ needs.prepare.outputs.code }}
      - uses: actions/download-artifact@v8
        with:
          name: docs-maintenance-context-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
      - name: Overlay PR documentation onto trusted current main
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" restore
      - name: Repair this concern from feedback and current implementation
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: 'claude,coderabbitai,github-actions'
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Read and follow ${{ runner.temp }}/nightly-docs-tools/maintenance-write.md.
            The maintenance context is ${{ runner.temp }}/docs-maintenance/context.json.
            The SMG source checkout is ${{ github.workspace }}/.nightly-source.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 120
            --add-dir ${{ github.workspace }}/.nightly-source
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export documentation data only
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" export
      - uses: actions/upload-artifact@v7
        with:
          name: docs-maintenance-draft-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance/bundle.json
          retention-days: 14
          if-no-files-found: error

  review:
    needs: [prepare, repair]
    if: needs.prepare.outputs.work == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve setup action across the documentation checkout
        run: |
          mkdir -p .maintenance-action
          cp .github/actions/docs-maintenance-setup/action.yml .maintenance-action/action.yml
          printf '/.maintenance-action/\n' >> .git/info/exclude
      - uses: ./.maintenance-action
        with:
          export-api-key: 'true'
          source-ref: ${{ needs.prepare.outputs.code }}
      - uses: actions/download-artifact@v8
        with:
          name: docs-maintenance-context-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
      - uses: actions/download-artifact@v8
        with:
          name: docs-maintenance-draft-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
      - name: Import with pristine scope and total-PR size guards
        id: scope
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" import
      - name: Independently verify the complete concern and feedback fixes
        id: review
        if: steps.scope.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: 'claude,coderabbitai,github-actions'
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Read and follow ${{ runner.temp }}/nightly-docs-tools/maintenance-review.md.
            The context is ${{ runner.temp }}/docs-maintenance/context.json.
            Review ${{ runner.temp }}/docs-maintenance/full-pr.patch in that directory.
            The SMG source checkout is ${{ github.workspace }}/.nightly-source.
          claude_args: >-
            --model claude-fable-5
            --effort xhigh
            --max-turns 120
            --add-dir ${{ github.workspace }}/.nightly-source
            --tools "Read,Glob,Grep"
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"single_concern":{"type":"boolean"},"accurate":{"type":"boolean"},"placement_appropriate":{"type":"boolean"},"related_docs_consistent":{"type":"boolean"},"reason":{"type":"string"},"addressed_threads":{"type":"array","uniqueItems":true,"items":{"type":"integer","minimum":1}}},"required":["single_concern","accurate","placement_appropriate","related_docs_consistent","reason","addressed_threads"]}'
      - name: Validate and save the independent verdict
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" review-export
      - name: Check artifact data for credentials
        id: scan
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" scan
      - uses: actions/upload-artifact@v7
        with:
          name: docs-maintenance-review-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
          retention-days: 14
          if-no-files-found: error

  validate-publish:
    needs: [prepare, review]
    if: needs.prepare.outputs.work == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 30
    outputs:
      round-completed: ${{ steps.finish.outcome == 'success' }}
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve setup action across the documentation checkout
        run: |
          mkdir -p .maintenance-action
          cp .github/actions/docs-maintenance-setup/action.yml .maintenance-action/action.yml
          printf '/.maintenance-action/\n' >> .git/info/exclude
      - uses: ./.maintenance-action
        with:
          export-api-key: 'false'
          source-ref: ${{ needs.prepare.outputs.code }}
      - uses: actions/download-artifact@v8
        with:
          name: docs-maintenance-review-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
      - name: Revalidate the reviewed documentation bundle
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" import
      - name: Require the independent accuracy and scope verdict
        id: verdict
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" review-gate
      # Initialize Node before installing the package manager on minimal runners.
      - uses: actions/setup-node@v6
        if: steps.verdict.outputs.accepted == 'true'
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        if: steps.verdict.outputs.accepted == 'true'
        with:
          version: 10
      - name: Build production documentation from the trusted base
        id: build
        if: steps.verdict.outputs.accepted == 'true'
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm exec wrangler types
          pnpm check
          pnpm build
      - name: Publish guarded repair and record the actual PR-head check
        id: finish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
        run: |
          gh auth setup-git
          python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" finish
      - name: Check evidence for credentials
        id: evidence
        if: always()
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/maintenance.py" scan
      - uses: actions/upload-artifact@v7
        if: always() && steps.evidence.outcome == 'success'
        with:
          name: docs-maintenance-evidence-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
          retention-days: 14
          if-no-files-found: error

  record-failure:
    needs: [prepare, repair, review, validate-publish]
    if: >-
      always() && inputs.apply && needs.prepare.outputs.work == 'true'
      && needs.validate-publish.outputs.round-completed != 'true'
      && (needs.repair.result != 'success' || needs.review.result != 'success' || needs.validate-publish.result != 'success')
    runs-on: smg-org-runner-cpu
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: docs-maintenance-context-${{ inputs.number }}
          path: ${{ runner.temp }}/docs-maintenance
      - name: Preserve setup action across the documentation checkout
        run: |
          mkdir -p .maintenance-action
          cp .github/actions/docs-maintenance-setup/action.yml .maintenance-action/action.yml
          printf '/.maintenance-action/\n' >> .git/info/exclude
      - uses: ./.maintenance-action
        with:
          export-api-key: 'false'
          source-ref: ''
      - run: python3 scripts/doc-sync/maintenance.py failure
        env:
          GH_TOKEN: ${{ github.token }}
