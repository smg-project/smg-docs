name: Reconcile Released Documentation Snapshot

on:
  workflow_call:
    inputs:
      release-json:
        type: string
        required: true
      docs-sha:
        type: string
        required: true
      diagnostic-run-id:
        type: string
        default: ''
      diagnostic-batches:
        type: string
        default: ''
      dry-run:
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  RELEASE_JSON: ${{ inputs.release-json }}

jobs:
  prepare:
    runs-on: smg-org-runner-cpu
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.diagnostic.outputs.matrix || steps.prepare.outputs.matrix }}
      checkpoint_sha: ${{ steps.diagnostic.outputs.checkpoint_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Freeze snapshot inputs and complete page coverage
        id: prepare
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" prepare
      - if: inputs.diagnostic-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-context
          run-id: ${{ inputs.diagnostic-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-checkpoint-context
      - if: inputs.diagnostic-run-id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          run-id: ${{ inputs.diagnostic-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-checkpoint-bundles
      - name: Validate frozen checkpoint and select diagnostic batches
        if: inputs.diagnostic-run-id != ''
        id: diagnostic
        env:
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
          DIAGNOSTIC_BATCHES: ${{ inputs.diagnostic-batches }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" prepare-diagnostic
      - uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
          retention-days: 14
          if-no-files-found: error

  write:
    needs: prepare
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - name: Seed only the selected release snapshot
        env:
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
        run: |
          if [ -n "$DIAGNOSTIC_RUN_ID" ]; then
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble
          else
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" seed
          fi
      - name: Audit each assigned page against the published release
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-write.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source.
            Your hard budget is ${{ matrix.max_turns }} turns; reserve the last
            60 turns for verified edits or the complete review verdict.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export Markdown data with strict page isolation
        env:
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
        run: |
          if [ -n "$DIAGNOSTIC_RUN_ID" ]; then
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" export-repair
          else
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" export
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/bundle-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: error

  review:
    needs: [prepare, write]
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Assemble all batches using pristine guards
        env:
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
          REPAIR_INPUT_SHA: ${{ needs.prepare.outputs.checkpoint_sha }}
        run: |
          if [ -n "$DIAGNOSTIC_RUN_ID" ]; then
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble-repaired
          else
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble
          fi
      - name: Independently review every assigned release page
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-review.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source.
            Your hard budget is ${{ matrix.max_turns }} turns; reserve the last
            60 turns for verified edits or the complete review verdict.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep" --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"accurate":{"type":"boolean"},"complete":{"type":"boolean"},"reader_focused":{"type":"boolean"},"related_docs_consistent":{"type":"boolean"},"reviewed_pages":{"type":"array","items":{"type":"string"}},"reason":{"type":"string"},"regression_checks":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"satisfied":{"type":"boolean"},"evidence":{"type":"string"}},"required":["id","satisfied","evidence"]}}},"required":["accurate","complete","reader_focused","related_docs_consistent","reviewed_pages","reason","regression_checks"]}'
      - name: Record validated findings for the bounded repair pass
        env:
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -n "$DIAGNOSTIC_RUN_ID" ]; then
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" review
          else
            python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" record-review
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-review-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/review-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: warn

  assess:
    if: inputs.diagnostic-run-id == ''
    needs: [prepare, review]
    runs-on: smg-org-runner-cpu
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      snapshot_sha: ${{ steps.plan.outputs.snapshot_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-review-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Validate review evidence and select repair coverage
        id: plan
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" plan-repair

  repair:
    needs: [prepare, assess]
    if: needs.assess.outputs.needed == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.assess.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-review-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Assemble the rejected proposal in an isolated repair job
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble-repair
      - name: Correct independently identified documentation defects
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-repair.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source. Read all validated findings in
            repair-findings.json, including other batches' findings about your
            assigned pages. Your own review is review-${{ matrix.batch }}.json.
            Your hard budget is
            ${{ matrix.max_turns }} turns; reserve the last 60 turns to finish.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export repaired Markdown with the original batch allowlist
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" export-repair
      - uses: actions/upload-artifact@v4
        with:
          name: release-repaired-bundle-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/bundle-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: error

  review-repair:
    needs: [prepare, assess, repair]
    if: needs.assess.outputs.needed == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
      REPAIR_INPUT_SHA: ${{ needs.assess.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repaired-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Assemble all batches using pristine guards
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble-repaired
      - name: Independently review every assigned release page
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-review.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source.
            Your hard budget is ${{ matrix.max_turns }} turns; reserve the last
            60 turns for verified edits or the complete review verdict.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep" --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"accurate":{"type":"boolean"},"complete":{"type":"boolean"},"reader_focused":{"type":"boolean"},"related_docs_consistent":{"type":"boolean"},"reviewed_pages":{"type":"array","items":{"type":"string"}},"reason":{"type":"string"},"regression_checks":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"satisfied":{"type":"boolean"},"evidence":{"type":"string"}},"required":["id","satisfied","evidence"]}}},"required":["accurate","complete","reader_focused","related_docs_consistent","reviewed_pages","reason","regression_checks"]}'
      - name: Record fresh findings after the first repair
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" record-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-repair-review-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/review-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: warn

  assess-followup:
    needs: [prepare, assess, review-repair]
    if: needs.assess.outputs.needed == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 15
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      matrix: ${{ steps.plan.outputs.matrix }}
      snapshot_sha: ${{ steps.plan.outputs.snapshot_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repaired-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repair-review-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Validate review evidence and select repair coverage
        id: plan
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" plan-repair

  repair-followup:
    needs: [prepare, assess-followup]
    if: needs.assess-followup.outputs.needed == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.assess-followup.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repaired-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repair-review-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Assemble the rejected proposal in an isolated repair job
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble-repair
      - name: Correct independently identified documentation defects
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-repair.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source. Read all validated findings in
            repair-findings.json, including other batches' findings about your
            assigned pages. Your own review is review-${{ matrix.batch }}.json.
            Your hard budget is
            ${{ matrix.max_turns }} turns; reserve the last 60 turns to finish.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep,Edit,Write"
            --allowedTools "Read,Glob,Grep,Edit,Write"
      - name: Export repaired Markdown with the original batch allowlist
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" export-repair
      - uses: actions/upload-artifact@v4
        with:
          name: release-followup-bundle-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/bundle-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: error

  final-review:
    needs: [prepare, assess-followup, repair-followup]
    if: needs.assess-followup.outputs.needed == 'true'
    runs-on: smg-org-runner-cpu
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.diagnostic-run-id != '' && 2 || 8 }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      BATCH: ${{ matrix.batch }}
      REPAIR_INPUT_SHA: ${{ needs.assess-followup.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-repaired-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-followup-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Assemble all batches using pristine guards
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" assemble-repaired
      - name: Independently review every assigned release page
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: >-
            Follow ${{ runner.temp }}/nightly-docs-tools/release-review.md.
            Evidence is in ${{ runner.temp }}/release-docs and source in
            ${{ github.workspace }}/.nightly-source.
            Your hard budget is ${{ matrix.max_turns }} turns; reserve the last
            60 turns for verified edits or the complete review verdict.
          claude_args: >-
            --model claude-fable-5 --effort xhigh --max-turns ${{ matrix.max_turns }}
            --tools "Read,Glob,Grep" --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"properties":{"accurate":{"type":"boolean"},"complete":{"type":"boolean"},"reader_focused":{"type":"boolean"},"related_docs_consistent":{"type":"boolean"},"reviewed_pages":{"type":"array","items":{"type":"string"}},"reason":{"type":"string"},"regression_checks":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"satisfied":{"type":"boolean"},"evidence":{"type":"string"}},"required":["id","satisfied","evidence"]}}},"required":["accurate","complete","reader_focused","related_docs_consistent","reviewed_pages","reason","regression_checks"]}'
      - name: Require independent review and exact page coverage
        env:
          REVIEW_JSON: ${{ steps.review.outputs.structured_output }}
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-final-review-${{ matrix.batch }}
          path: ${{ runner.temp }}/release-docs/review-${{ matrix.batch }}.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [prepare, assess, repair, review-repair, assess-followup, repair-followup, final-review]
    if: >-
      always() && inputs.diagnostic-run-id == '' &&
      needs.prepare.result == 'success' && needs.assess.result == 'success' &&
      (needs.assess.outputs.needed == 'false' ||
      (needs.repair.result == 'success' && needs.review-repair.result == 'success' &&
      needs.assess-followup.result == 'success' &&
      (needs.assess-followup.outputs.needed == 'false' ||
      (needs.repair-followup.result == 'success' && needs.final-review.result == 'success'))))
    runs-on: smg-org-runner-cpu
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve trusted setup across the documentation checkout
        run: |
          mkdir -p .nightly-action
          cp .github/actions/nightly-docs-setup/action.yml .nightly-action/action.yml
          printf '/.nightly-action/\n/.nightly-source/\n' >> .git/info/exclude
      - uses: ./.nightly-action
        with:
          docs-sha: ${{ inputs.docs-sha }}
          source-ref: ${{ fromJSON(inputs.release-json).sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-context
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - if: needs.assess.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-repaired-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - if: needs.assess-followup.outputs.needed == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: release-followup-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.assess-followup.outputs.needed == 'true' && 'release-final-review-*' || needs.assess.outputs.needed == 'true' && 'release-repair-review-*' || 'release-review-*' }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-docs
      - name: Require all accepted batches and stage the release snapshot
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" finalize
      - name: Refresh unrelated working-page edits before final validation
        id: baseline
        run: python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" refresh
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Validate every version, links, types and production build
        run: |
          pnpm test:docs
          pnpm exec wrangler types
          pnpm check
          pnpm build
      - name: Publish one audited release snapshot PR
        env:
          GH_TOKEN: ${{ secrets.DOC_SYNC_TOKEN || github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic-run-id }}
          DRY_RUN: ${{ inputs.dry-run }}
          DOCS_PUBLISH_BASE: ${{ steps.baseline.outputs.base }}
        run: |
          gh auth setup-git
          python3 "$RUNNER_TEMP/nightly-docs-tools/snapshots.py" publish
