name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-sync-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Fixture commits otherwise start a detached `git maintenance run --auto`
      # (Git 2.47+), whose lock file can race temp-repo cleanup: run 42793291666
      # lost release review batch 31 to "Directory not empty: '.git'".
      - run: python -m unittest discover -s scripts/doc-sync -p 'test_*.py' -v
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: 'false'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler types
      - run: pnpm check
      - run: pnpm test:docs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler types
      - run: pnpm build

  finish:
    needs: [lint, check, build, doc-sync-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.check.result }}" == "failure" || \
                "${{ needs.build.result }}" == "failure" || \
                "${{ needs.doc-sync-tests.result }}" == "failure" ]]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
